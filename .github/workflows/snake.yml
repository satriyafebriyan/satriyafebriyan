name: Generate Snake and Pacman Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # 1. Generate Snake
      - name: Generate Snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      # 2. Generate Pacman
      - name: Generate Pacman SVG
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          snake_type: 'pacman'
          outputs: |
            dist/pacman.svg
            dist/pacman-dark.svg?palette=github-dark

      # 3. Deploy ke branch output
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
